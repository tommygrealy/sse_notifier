# Only /stream is public. /notify and /health are intentionally not proxied.
server {
    listen 443 ssl;
    server_name metrics.inpho.ie;
    # ssl_certificate / ssl_certificate_key ...

    location = /stream {
        proxy_pass http://127.0.0.1:8021/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Everything else on this host is not served by inpho-sse.
}
